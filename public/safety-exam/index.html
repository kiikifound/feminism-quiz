function pageHeading(title,description){return `<div class="top"><div><div class="eyebrow">PERSONAL LEARNING WORKSPACE</div><h1>${title}</h1><div class="sub">${description}</div></div><div class="pill">本地自动保存 · ${Q.length} 题</div></div>`}
function stat(label,n,note){return `<div class="stat"><div class="t">${label}</div><div class="v">${n}</div><div class="d">${note}</div></div>`}
function bar(label,a,b,cls=''){return `<div class="barrow ${cls}"><span>${escapeHTML(label)}</span><div class="barbg"><i style="width:${pct(a,b)}%"></i></div><small>${a}/${b}</small></div>`}
function sourceProgress(){return sourceNames.map((s,i)=>{let n=Q.filter(q=>q.s===i&&done(q)).length,t=Q.filter(q=>q.s===i).length;return `<div><div class="source-title"><strong>${s}</strong><span>${n} / ${t} · ${pct(n,t)}%</span></div><div class="progress"><i style="width:${pct(n,t)}%"></i></div></div>`}).join('')}
function home(){let n=answered().length,accur=pct(correct().length,n),last=state.resume,groups=topicStats().filter(x=>x.n>=5).sort((a,b)=>a.rate-b.rate),next=last&&Q.find(q=>q.id===last.id);return pageHeading('你的学习总览','围绕考试题库进行持续练习，用真实答题记录识别需要强化的知识领域。')+`<div class="stats">${stat('总题量',Q.length,'公共题库 969 · 专业题库 151')}${stat('已练习',n,'题目覆盖率 '+pct(n,Q.length)+'%')}${stat('最新作答正确率',n?accur+'%':'—','按每题最近一次答题计算')}${stat('待纠正错题',wrong().length,'最近一次答错的题目')}</div><div class="hero"><div class="rowline"><div><div class="eyebrow">CONTINUE LEARNING</div><h2>${next?'接着上次的位置继续':'开始你的第一次练习'}</h2><div class="sub">${next?`上次：${sourceNames[next.s]} · ${next.type} · 第 ${next.row-2} 题`:'推荐先顺序刷题，系统会实时累计错题和知识点表现。'}</div></div><div class="spacer"></div><button class="btn" id="resumeBtn">${next?'继续刷题':'开始刷题'}</button></div></div><div class="layout2"><section class="panel"><h3>题库完成进度</h3><div class="source">${sourceProgress()}</div><div class="actions"><button class="btn outline" data-quick="0">公共题库</button><button class="btn outline" data-quick="1">专业题库</button></div></section><section class="panel"><div class="panelhead"><h3>待强化知识点</h3><span class="muted">至少练习5题</span></div>${groups.length?`<div class="bars">${groups.slice(0,5).map(t=>bar(t.name,t.ok,t.n,t.rate<60?'low':'' )).join('')}</div>`:`<div class="empty">每个知识点积累至少5道作答记录后，显示相对薄弱领域。</div>`}</section></div><div class="notice">提示：系统在此设备浏览器自动保存学习记录；无账号及云端同步。清除浏览器网站数据会导致记录丢失，建议定期在「数据管理」导出备份。</div>`}
function topicStats(source='all'){let arr=Q.filter(q=>source==='all'||String(q.s)===String(source)),names=[...new Set(arr.map(q=>q.topic))];return names.map(name=>{let all=arr.filter(q=>q.topic===name),tested=all.filter(done),ok=tested.filter(q=>record(q).lastCorrect).length;return {name,total:all.length,n:tested.length,ok,rate:pct(ok,tested.length)}})}
function select(id,label,options,value){return `<div class="field"><label>${label}</label><select id="${id}">${options.map(([v,t])=>`<option value="${escapeHTML(v)}" ${String(value)===String(v)?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select></div>`}
function setOptions(){let src=[['all','全部题库'],['0','公共题库'],['1','北京执法专业题库']],types=[['all','全部题型'],['单选','单选题'],['多选','多选题'],['判断','判断题']],mode=[['order','顺序刷题'],['random','随机刷题'],['unseen','只刷未做题'],['wrong','错题重练'],['fav','只看收藏']],topic=[['all','全部知识点'],...[...new Set(Q.filter(q=>filter.source==='all'||String(q.s)===filter.source).map(q=>q.topic))].sort().map(x=>[x,x])];return select('f-source','题库',src,filter.source)+select('f-type','题型',types,filter.type)+select('f-topic','知识点（自动推断）',topic,filter.topic)+select('f-mode','练习模式',mode,filter.mode)}
function pool(){let a=Q.filter(q=>(filter.source==='all'||String(q.s)===filter.source)&&(filter.type==='all'||q.type===filter.type)&&(filter.topic==='all'||q.topic===filter.topic));if(filter.mode==='unseen')a=a.filter(q=>!done(q));if(filter.mode==='wrong')a=a.filter(isWrong);if(filter.mode==='fav')a=a.filter(isFav);if(filter.mode==='random')a=shuffle(a);return a}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startPractice(preserve=false){page='practice';practice=pool();if(!practice.length){pos=0;revealed=false;render();return}pos=0;if(preserve&&state.resume){let i=practice.findIndex(q=>q.id===state.resume.id);if(i>=0)pos=i}loadQuestion();page='practice';render()}
function loadQuestion(){chosen=[];revealed=false;if(practice[pos]){let q=practice[pos];state.resume={id:q.id,source:filter.source,type:filter.type,topic:filter.topic,mode:filter.mode};save()}}
function practicePage(){return pageHeading('专项刷题','可按题库、题型、知识点筛选，作答自动记入学习档案。')+`<div class="controls">${setOptions()}<button class="btn" id="applyFilters">生成练习</button></div>`+(practice.length?`<div class="examstatus"><span class="status">当前练习共 ${practice.length} 题 · 第 ${pos+1} 题</span><span class="status">答题后显示答案，切换题目自动保存位置</span></div>${questionMarkup(practice[pos],false)}<div class="qfoot"><button class="btn outline" id="prevQuestion" ${pos===0?'disabled':''}>上一题</button><div class="actions"><button class="btn outline" id="skipQuestion">下一题 ${pos+1===practice.length?'（结束）':''}</button></div></div>`:`<div class="panel empty">${filter.mode==='wrong'?'当前筛选下没有待纠正错题':filter.mode==='fav'?'当前筛选下没有收藏题目':filter.mode==='unseen'?'当前筛选下的题目已经全部练习':'请点击「生成练习」开始。'}</div>`)}
function questionMarkup(q,examMode){let submission=examMode?exam?.answers[q.id]:null,sel=examMode?(submission||[]):chosen,seen=examMode?false:revealed;return `<article class="question"><div class="meta"><span class="tag blue">${sourceNames[q.s]}</span><span class="tag">${q.type}题</span><span class="tag">${escapeHTML(q.topic)}</span><span class="tag">原表第 ${q.row} 行</span><span class="spacer"></span>${!examMode?`<button class="btn outline" id="favoriteButton">${isFav(q)?'★ 已收藏':'☆ 收藏本题'}</button>`:''}</div><h2 class="qtitle">${escapeHTML(q.q)}</h2><div class="hint" style="margin-bottom:12px">${q.type==='多选'?'多选题：请选择所有正确选项，再提交':'请选择一个答案'}</div><div class="opts">${q.o.map((text,i)=>{let selected=sel.includes(i),yes=q.a.includes(i);return `<button class="option ${selected?'chosen':''} ${seen&&yes?'correct':''} ${seen&&selected&&!yes?'wrong':''}" data-opt="${i}" ${seen?'disabled':''}><span class="letter">${q.type==='判断'?(i===0?'√':'×'):String.fromCharCode(65+i)}</span><span>${escapeHTML(text)}</span></button>`}).join('')}</div>${!examMode&&!seen?`<div class="qfoot"><span class="hint">当前选择 ${sel.length} 项</span><button id="submitAnswer" class="btn" ${!sel.length?'disabled':''}>提交答案</button></div>`:''}${!examMode&&seen?`<div class="answerbox ${same(sel,q.a)?'ok':'no'}"><strong>${same(sel,q.a)?'✓ 回答正确':'✕ 回答错误'} · 正确答案：${formatAns(q,q.a)}</strong><p>你的答案：${formatAns(q,sel)}</p><p>${q.ex?'原题库解析 / 法规引用：'+escapeHTML(q.ex):'原题库未提供解析；仅展示原始标准答案。'}</p></div>`:''}${examMode?`<div class="qfoot"><span class="hint">已选择 ${sel.length} 项</span><button class="btn outline" id="clearExam">清除本题答案</button></div>`:''}</article>`}
function formatAns(q,a){return a.length?a.map(i=>q.type==='判断'?(i===0?'对':'错'):String.fromCharCode(65+i)).join('、'):'未作答'}
function same(a,b){return a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i])}
function answer(q,sel){if(!sel.length)return;let prev=state.answers[q.id]||{attempts:0,correctAttempts:0,history:[]};let good=same(sel,q.a);let history=[...(prev.history||[]),{at:Date.now(),correct:good}].slice(-20);state.answers[q.id]={attempts:prev.attempts+1,correctAttempts:prev.correctAttempts+(good?1:0),lastCorrect:good,last:[...sel],updated:Date.now(),history};save()}
function analysisPage(){let topics=topicStats().sort((a,b)=>a.rate-b.rate),valid=topics.filter(x=>x.n>=5),good=[...valid].reverse().slice(0,4),bad=valid.slice(0,4);let ty=['单选','多选','判断'].map(name=>{let a=Q.filter(q=>q.type===name&&done(q));return {name,n:a.length,ok:a.filter(q=>record(q).lastCorrect).length}});return pageHeading('知识点与能力分析','以每道题最近一次答题为准；知识点来自题干关键词归类，并非官方标签。')+`<div class="stats">${stat('已评估题目',answered().length,'覆盖 '+pct(answered().length,Q.length)+'%')}${stat('整体正确率',answered().length?pct(correct().length,answered().length)+'%':'—','仅统计已作答题目')}${stat('已纠正错题',Q.filter(q=>done(q)&&record(q).attempts>1&&record(q).lastCorrect&&record(q).correctAttempts<record(q).attempts).length,'曾答错、最近一次答对')}${stat('知识点覆盖',topics.filter(t=>t.n>0).length+'/'+topics.length,'包含系统推断类别')}</div><div class="twocol"><section class="panel"><h3>优势知识点</h3>${good.length?`<div class="bars">${good.map(t=>bar(t.name,t.ok,t.n,'high')).join('')}</div>`:'<div class="empty">暂无足够数据，单个知识点至少作答5题后评估。</div>'}</section><section class="panel"><h3>优先强化知识点</h3>${bad.length?`<div class="bars">${bad.map(t=>bar(t.name,t.ok,t.n,'low')).join('')}</div>`:'<div class="empty">暂无足够数据，单个知识点至少作答5题后评估。</div>'}</section></div><div class="layout2"><section class="panel"><h3>全部知识领域</h3><div class="bars">${topics.map(t=>bar(t.name,t.ok,t.n,t.n>=5?(t.rate>=80?'high':t.rate<60?'low':''):'' )).join('')}</div><div class="notice">每行显示「最近一次正确数 / 已练习数」，未练习的知识点不能被判断为弱项。样本少于5题时，表现仅供参考。</div></section><section class="panel"><h3>题型能力</h3><div class="bars">${ty.map(t=>bar(t.name,t.ok,t.n)).join('')}</div><h3 style="margin-top:27px">推荐复习方式</h3><div class="sub">${bad.length?`建议优先复习「${escapeHTML(bad[0].name)}」，当前正确率 ${bad[0].rate}%（${bad[0].n} 题）。`:'先完成一定量的练习，再依据实际正确率安排复习优先级。'}</div><div class="actions" style="margin-top:18px"><button class="btn" id="goWrong">错题专项训练</button><button class="btn outline" id="goUnseen">补齐未做题</button></div></section></div>`}
function listsPage(){let arr=listTab==='wrong'?wrong():listTab==='fav'?Q.filter(isFav):Q.filter(q=>done(q)&&record(q).attempts>1&&record(q).lastCorrect&&record(q).correctAttempts<record(q).attempts);return pageHeading('错题与重点收藏','错题按最近一次答题结果动态更新，答对后移入已纠正记录。')+`<div class="tabs">${[['wrong','待纠正错题'],['fav','我的收藏'],['fixed','已纠正错题']].map(([x,t])=>`<button data-tab="${x}" class="${listTab===x?'active':''}">${t}</button>`).join('')}</div><div class="panel"><div class="panelhead"><h3>共 ${arr.length} 道题</h3><button class="btn" id="practiceList" ${!arr.length?'disabled':''}>练习当前列表</button></div>${arr.length?`<div class="listrows">${arr.slice(0,300).map(q=>`<button class="listrow" data-jump="${q.id}"><span class="text">${escapeHTML(q.q)}</span><small>${q.type} · ${escapeHTML(q.topic)}</small></button>`).join('')}</div>${arr.length>300?'<div class="notice">列表仅展示前300道；点击专项训练可练习全部符合条件的题目。</div>':''}`:'<div class="empty">当前列表没有题目。</div>'}</div>`}
function examPage(){if(exam?.finished)return examResult();if(exam?.ids?.length)return examQuestion();return pageHeading('模拟考试','从所选题库随机抽题；考试中不显示答案，交卷后统一评分。')+`<div class="panel" style="max-width:720px"><h3>组卷设置</h3><div class="controls">${select('examSource','出题范围',[['all','全部题库'],['0','公共题库'],['1','北京执法专业题库']],'all')}${select('examCount','题目数量',[[20,'20 题'],[50,'50 题'],[100,'100 题']],'50')}</div><p class="sub">多选题须完全选对才计正确；每题等权计分。考试草稿会保存在当前浏览器。</p><button class="btn" id="startExam">开始模拟考试</button></div>${state.examHistory.length?`<div class="panel" style="margin-top:17px"><h3>最近考试记录</h3><div class="listrows">${state.examHistory.slice(-8).reverse().map(h=>`<div class="listrow"><span class="text">${dateText(h.date)} · ${h.count} 题</span><strong>${h.score}%</strong></div>`).join('')}</div></div>`:''}`}
function examQuestion(){let q=Q.find(x=>x.id===exam.ids[exam.pos]);let filled=exam.ids.filter(id=>exam.answers[id]?.length).length;return pageHeading('模拟考试进行中',`已答 ${filled}/${exam.ids.length} 题 · 考试过程自动保存`)+`<div class="examstatus"><span class="status">第 ${exam.pos+1} / ${exam.ids.length} 题</span><button class="btn warn" id="finishExam">交卷评分</button></div>${questionMarkup(q,true)}<div class="qfoot"><button class="btn outline" id="examPrev" ${exam.pos===0?'disabled':''}>上一题</button><button class="btn" id="examNext" ${exam.pos>=exam.ids.length-1?'disabled':''}>下一题</button></div><div class="dotline">${exam.ids.map((id,i)=>`<button class="dot ${exam.answers[id]?.length?'answered':''} ${i===exam.pos?'current':''}" data-exampos="${i}">${i+1}</button>`).join('')}</div>`}
function examResult(){let items=exam.ids.map(id=>Q.find(x=>x.id===id)),ok=items.filter(q=>same(exam.answers[q.id]||[],q.a)),missed=items.filter(q=>!same(exam.answers[q.id]||[],q.a));return pageHeading('模拟考试成绩','本次考试已提交，所有题目均可查看正确答案。')+`<div class="stats">${stat('本次得分',pct(ok.length,items.length)+' 分','按百分制折算')}${stat('答对',ok.length,'总题数 '+items.length)}${stat('答错 / 未答',missed.length,'可加入针对性复习')}${stat('考试完成','已交卷','已计入错题与学习统计')}</div><div class="panel"><div class="panelhead"><h3>错题与未答题复盘</h3><button id="resetExam" class="btn">再考一次</button></div>${missed.length?`<div class="listrows">${missed.map(q=>`<div class="listrow" style="display:block"><div style="font-size:13px;line-height:1.75;font-weight:600">${escapeHTML(q.q)}</div><div class="sub">你的答案：${formatAns(q,exam.answers[q.id]||[])}　|　正确答案：${formatAns(q,q.a)}</div><div class="sub">${q.ex?'原题库引用：'+escapeHTML(q.ex):'原题库未提供解析'}</div></div>`).join('')}</div>`:'<div class="empty">全部正确。</div>'}</div>`}
function settingsPage(){return pageHeading('学习数据与备份','掌握你的学习记录，迁移设备时可导出并导入数据文件。')+`<div class="panel" style="max-width:760px"><h3>记录管理</h3><p class="sub">自动保存内容：答题次数、最近作答结果、错题状态、收藏、继续刷题位置、模拟考试成绩和未交卷草稿。</p><div class="actions" style="margin:20px 0"><button id="exportData" class="btn">导出学习备份 (.json)</button><label class="btn outline" style="display:inline-block;cursor:pointer">导入学习备份<input type="file" accept=".json,application/json" id="importData" style="display:none"></label><button id="clearData" class="btn warn">清空学习记录</button></div><div class="notice">当前浏览器已练习 ${answered().length} 题；上次保存：${dateText(state.lastVisit)}。导入会替换当前设备已有的记录；不同设备不会自动同步。请勿在无痕模式下长期使用。</div></div><section class="panel" style="margin-top:17px;max-width:760px"><h3>题库说明与限制</h3><p class="sub">包含公共题库 969 题、北京市乡镇街道安全生产执法专业题库 151 题。所有题目、选项、答案均取自上传文件。专业题库中的法规引用按原文件保留，公共题库未提供解析。</p><p class="sub">知识点由题干关键词自动匹配，用于辅助复习，并不是权威的法律分类。该网站不联网更新法规、不会核实题库答案的法律时效性。</p></section>`}
function render(){let v=page==='home'?home():page==='practice'?practicePage():page==='analysis'?analysisPage():page==='lists'?listsPage():page==='exam'?examPage():settingsPage();$('#app').innerHTML=`<div class="app">${navMarkup()}<main class="main">${v}</main></div>`;bind()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));
 if(page==='home'){$('#resumeBtn').onclick=()=>{if(state.resume){filter={source:state.resume.source||'all',type:state.resume.type||'all',mode:state.resume.mode||'order',topic:state.resume.topic||'all'};startPractice(true)}else{filter={source:'all',type:'all',mode:'order',topic:'all'};startPractice()}};document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{filter={source:b.dataset.quick,type:'all',mode:'order',topic:'all'};startPractice(true)})}
 if(page==='practice'){let update=()=>{filter={source:$('#f-source').value,type:$('#f-type').value,mode:$('#f-mode').value,topic:$('#f-topic').value};};$('#f-source').onchange=()=>{let s=$('#f-source').value;filter.source=s;filter.topic='all';render()};$('#applyFilters').onclick=()=>{update();startPractice()};if(practice.length){let q=practice[pos];document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let i=+b.dataset.opt;if(q.type==='多选'){chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i]}else{chosen=[i]}render()});if($('#submitAnswer'))$('#submitAnswer').onclick=()=>{answer(q,chosen);revealed=true;render()};$('#favoriteButton').onclick=()=>{state.favorites=isFav(q)?state.favorites.filter(id=>id!==q.id):[...state.favorites,q.id];save();render()};$('#prevQuestion').onclick=()=>{if(pos>0){pos--;loadQuestion();render()}};$('#skipQuestion').onclick=()=>{if(pos<practice.length-1){pos++;loadQuestion();render()}else{nav('home')}}}}
 if(page==='analysis'){$('#goWrong').onclick=()=>{filter={source:'all',type:'all',topic:'all',mode:'wrong'};startPractice()};$('#goUnseen').onclick=()=>{filter={source:'all',type:'all',topic:'all',mode:'unseen'};startPractice()}}
 if(page==='lists'){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{listTab=b.dataset.tab;render()});$('#practiceList').onclick=()=>{let m=listTab==='fav'?'fav':listTab==='wrong'?'wrong':null;if(m){filter={source:'all',type:'all',topic:'all',mode:m};startPractice()}else{practice=Q.filter(q=>done(q)&&record(q).attempts>1&&record(q).lastCorrect&&record(q).correctAttempts<record(q).attempts);pos=0;loadQuestion();nav('practice')}};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{practice=Q.filter(q=>q.id===b.dataset.jump);pos=0;filter={source:'all',type:'all',topic:'all',mode:'order'};loadQuestion();nav('practice')})}
 if(page==='exam'){if(!exam?.ids?.length){$('#startExam').onclick=()=>{let src=$('#examSource').value;let candidates=shuffle(Q.filter(q=>src==='all'||String(q.s)===src));let count=+$('#examCount').value;exam={ids:candidates.slice(0,count).map(q=>q.id),pos:0,answers:{},finished:false,started:Date.now()};saveExam();render()}}else if(exam.finished){$('#resetExam').onclick=()=>{exam=null;saveExam();render()}}else{let q=Q.find(x=>x.id===exam.ids[exam.pos]);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let i=+b.dataset.opt,sel=exam.answers[q.id]||[];exam.answers[q.id]=q.type==='多选'?(sel.includes(i)?sel.filter(v=>v!==i):[...sel,i]):[i];saveExam();render()});$('#clearExam').onclick=()=>{delete exam.answers[q.id];saveExam();render()};$('#examPrev').onclick=()=>{exam.pos--;saveExam();render()};$('#examNext').onclick=()=>{exam.pos++;saveExam();render()};document.querySelectorAll('[data-exampos]').forEach(b=>b.onclick=()=>{exam.pos=+b.dataset.exampos;saveExam();render()});$('#finishExam').onclick=()=>{let missing=exam.ids.filter(id=>!exam.answers[id]?.length).length;if(missing&&!confirm(`还有 ${missing} 道题未答，确定交卷吗？`))return;let ok=0;for(let id of exam.ids){let q=Q.find(x=>x.id===id),sel=exam.answers[id]||[];if(same(sel,q.a))ok++;if(sel.length)answer(q,sel)}exam.finished=true;state.examHistory=[...state.examHistory,{date:Date.now(),count:exam.ids.length,score:pct(ok,exam.ids.length)}].slice(-30);saveExam();render()}}}
 if(page==='settings'){$('#exportData').onclick=()=>{let blob=new Blob([JSON.stringify({format:'safety-quiz-backup-v1',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`执法刷题学习备份_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importData').onchange=async(e)=>{let f=e.target.files[0];if(!f)return;try{let payload=JSON.parse(await f.text()),data=payload.data;if(payload.format!=='safety-quiz-backup-v1'||data.version!==1||typeof data.answers!=='object'||!Array.isArray(data.favorites))throw Error('格式不匹配');if(!confirm('导入将覆盖此浏览器现有的学习记录。是否继续？'))return;state=data;exam=state.examDraft||null;save();render();alert('导入完成')}catch(err){alert('无法导入：'+err.message)}};$('#clearData').onclick=()=>{if(confirm('这将永久清除当前设备上的全部学习进度、错题、收藏和考试记录。建议先导出备份。确定清除？')){state={version:1,answers:{},favorites:[],resume:null,examHistory:[],lastVisit:null};exam=null;practice=[];save();nav('home')}}}}
function saveExam(){state.examDraft=exam;save()}
exam=state.examDraft||null;render();</script></body></html>
